const params = new URLSearchParams(window.location.search);
const file = params.get('file');
if(!file||file==='null'){document.getElementById('book-title').textContent='未指定书籍';return}
const path = file;

const titles = {'园冶注释 （第二版）.pdf':'园冶注释','扬州园林.pdf':'扬州园林','扬州园林 图册.pdf':'扬州园林 图册','江南园林志 一.pdf':'江南园林志','上海豫园.pdf':'上海豫园','画境文心：中国古典园林之美.pdf.pdf':'画境文心：中国古典园林之美','苏州园林.pdf':'苏州园林','苏州园林匾额楹联鉴赏.pdf':'苏州园林匾额楹联鉴赏','说园.pdf':'说园','陈从周说园.epub':'陈从周说园（EPUB）','陈从周全集7-园林谈丛.pdf':'陈从周全集7：园林谈丛','园林与中国文化.pdf.pdf':'园林与中国文化','西方园林史.pdf':'西方园林史',};
const descs = {'园冶注释 （第二版）.pdf':'世界第一部园林艺术专著，中国古典园林的理论基石。陈植先生的注释版是最权威版本之一。','扬州园林.pdf':'扬州园林艺术特色与经典案例解析。个园、何园、瘦西湖等扬州园林集群的深度解读。','扬州园林 图册.pdf':'陈从周先生拍摄绘制的扬州园林影像图册，珍贵历史资料。','江南园林志 一.pdf':'童寯先生经典之作。系统考察江南园林，测量绘图并记录造园理法。','上海豫园.pdf':'上海豫园的历史沿革、景区特色与造园艺术全解。','画境文心：中国古典园林之美.pdf.pdf':'中国古典园林美学入门——画境即园境，文心即园心。','苏州园林.pdf':'苏州园林的官方权威介绍，涵盖拙政园、留园、网师园等经典。','苏州园林匾额楹联鉴赏.pdf':'苏州园林匾额楹联的系统解读，以文字解读园林意境。','说园.pdf':'陈从周先生谈中国园林的经典文集。文笔优美，见解独到，中国园林美学的入门必读。','陈从周说园.epub':'《说园》的EPUB格式版本，适合移动设备阅读。','陈从周全集7-园林谈丛.pdf':'陈从周先生园林文章合集，涵盖园林谈丛、园林散记等，是研究中国园林的重要文献。','园林与中国文化.pdf.pdf':'从文化角度解读中国园林，探讨园林与中国哲学、文学、绘画的深层关联。','西方园林史.pdf':'高等院校风景园林专业教材，系统讲述古埃及至当代的西方园林演变。',};

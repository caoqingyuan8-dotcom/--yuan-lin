  <h1>第六部分：中世纪欧洲园林（约5—14世纪）——虔诚与实用</h1>

  <div class="content">
    <p>罗马帝国崩溃后近千年，园林以实用形式存活在修道院的高墙之内。</p>
<p><strong>修道院园林</strong>：药圃（现代植物园的源头）、菜园、回廊园（拱廊围合的方形庭院，中央设喷泉）。</p>
<p><strong>历史定位</strong>：严格意义上的"艺术园林"极少。但在修道院中，罗马人的园艺技术被保存下来。</p>

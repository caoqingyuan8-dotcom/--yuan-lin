.back-link:hover{background:#f0f8f4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px}
.grid img{width:100%;height:180px;object-fit:cover;border-radius:8px;cursor:pointer;transition:transform .15s}
.grid img:hover{transform:scale(1.02);box-shadow:0 3px 12px rgba(0,0,0,.1)}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999}
.overlay.on{display:flex;justify-content:center;align-items:center}
.overlay img{max-width:90vw;max-height:90vh;border-radius:4px}
.close{position:absolute;top:20px;right:30px;font-size:2rem;color:#fff;cursor:pointer;opacity:.7}
.close:hover{opacity:1}
</style></head><body>
